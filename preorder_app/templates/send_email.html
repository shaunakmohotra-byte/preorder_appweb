{% extends "base.html" %}

{% block content %}
<section class="admin-section email-compose-page">
    <div class="admin-section-header">
        <div class="admin-section-title">
            <div class="admin-section-icon">📧</div>
            <div>
                <h2>Send email to all users</h2>
                <p>Each recipient receives a separate private email.</p>
            </div>
        </div>
        <span class="section-label">EMAIL BROADCAST</span>
    </div>

    <form method="post" class="email-compose-form">
        <div class="form-group">
            <label for="subject">Subject</label>
            <input
                id="subject"
                name="subject"
                type="text"
                maxlength="200"
                required
                autofocus
                placeholder="Important cafeteria announcement"
            >
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                rows="10"
                required
                placeholder="Write your message here..."
            ></textarea>
        </div>

        <div class="email-compose-actions">
            <button class="btn email-compose-submit" type="submit">📨 Send email</button>
            <a class="btn email-compose-cancel" href="{{ url_for('admin.index') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
