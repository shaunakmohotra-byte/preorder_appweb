{% extends 'base.html' %}

{% block content %}
<h2>Login</h2>

<form method='post'>
    Email: <input name='email' required type='email'><br>
    Password: <input name='password' type='password' required><br>
    <button>Login</button>
</form>

<div class="demo-login-wrapper" style="margin-top: 20px; text-align: center;">
    <p style="font-size: 13px; color: #666; margin-bottom: 10px;">
        Just want to look around?
    </p>
    
    <!-- FIX: Added 'main.' to the url_for -->
    <a href="{{ url_for('main.demo_login') }}" class="btn demo-btn" style="
        display: inline-block;
        padding: 10px 20px;
        background-color: #f1f3f5;
        color: #333;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        border: 1px solid #ddd;
        transition: all 0.2s ease;
    ">
        🧪 Test the App (Guest Mode)
    </a>
</div>

{% endblock %}
